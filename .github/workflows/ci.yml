name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build -w web

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Migration und Zugriffsregeln prüfen
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/supabase_stub.sql
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -d gp -f "$f"; done
          psql -v ON_ERROR_STOP=1 -d gp -f supabase/tests/rls_test.sql
